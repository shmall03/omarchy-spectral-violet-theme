# Vicinae's theme docs: https://docs.vicinae.com/theming/getting-started

[meta]
name        = "Spectral Violet" # Updated name
description = "A haunting, ethereal violet theme for Omarchy. Deep blacks meet vibrant spectral purples for a focused, mystical experience."
variant     = "dark" 
icon        = "icons/spectral-violet-icon.png"

# ============================================================================
# Core Colors
# ============================================================================
# Mapping Spectral Violet palette:
# background = #040305
# foreground = #d9d3de
# accent     = #9357ce

[colors.core]
accent               = "#9357ce" 
accent_foreground    = "#040305" 
background           = "#040305" 
foreground           = "#d9d3de" 
secondary_background = "#0d0a12" # slightly lighter black
border               = "#a765e9" 

# ============================================================================
# Window-Specific Colors
# ============================================================================

[colors.main_window]
border = "colors.core.border"

[colors.settings_window]
border = "colors.core.border"

# ============================================================================
# Accent Colors
# ============================================================================

[colors.accents]
blue    = "#adadeb"
green   = "#70dc70"
magenta = "#ebadeb"
orange  = "#ebadad"
red     = "#dc7070"
yellow  = "#dcdc70"
cyan    = "#70dcdc"
purple  = "#dc70dc"

# ============================================================================
# Text Colors
# ============================================================================

[colors.text]
default     = "colors.core.foreground"
muted       = "#a694b8" 
danger      = "colors.accents.red"
success     = "colors.accents.green"
placeholder = "#a694b8" 
selection   = { background = "colors.core.accent", foreground = "colors.core.accent_foreground" }

[colors.text.links]
default = "colors.accents.purple" 
visited = "colors.accents.magenta" 

# ============================================================================
# Input Fields
# ============================================================================

[colors.input]
border       = "colors.core.border"
border_focus = "colors.core.accent"
border_error = "colors.accents.red"

# ============================================================================
# Buttons
# ============================================================================

[colors.button.primary]
background = "colors.core.secondary_background"
foreground = "colors.core.foreground"
hover      = { background = "#9357ce" }
focus      = { outline = "colors.core.accent" }

# ============================================================================
# Lists
# ============================================================================

[colors.list.item.hover]
background = "colors.core.secondary_background"
foreground = "colors.core.foreground"

[colors.list.item.selection]
background           = "colors.core.secondary_background"
foreground           = "colors.core.foreground"
secondary_background = "colors.core.border"
secondary_foreground = "colors.core.foreground"

# ============================================================================
# Grid Items
# ============================================================================

[colors.grid.item]
background = "colors.core.secondary_background"
hover      = { outline = "colors.core.foreground" }
selection  = { outline = "colors.core.accent" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = "colors.core.border"

# ============================================================================
# Loading Indicators
# ============================================================================

[colors.loading]
bar     = "colors.core.foreground"
spinner = "colors.core.foreground"
